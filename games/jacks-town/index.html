<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Jack's Town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f3e3c3; font-family: Fredoka, system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  #hud { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; pointer-events: none; }
  #fuel { pointer-events: auto; display: flex; align-items: center; gap: 6px; background: #fff; border: 3px solid #1f7a3a; border-radius: 999px; padding: 4px 10px 4px 6px; box-shadow: 0 3px 0 #145a2a; }
  #fuel .icon { font-size: 24px; }
  #fuel .gauge { width: 90px; height: 16px; border-radius: 99px; background: #e7e7e7; overflow: hidden; border: 2px solid #ccc; }
  #fuel .fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff5a4f, #ffcc33 40%, #49c45a); transition: width .2s; }
  #fuel.low .gauge { animation: blink .6s steps(2) infinite; }
  #fuel.hidden { visibility: hidden; }
  @keyframes blink { 50% { border-color: #ff3b30; background: #ffd0cc; } }
  #stickers { pointer-events: auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; background: #fff; border: 3px solid #1f7a3a; border-radius: 30px; padding: 4px 8px; box-shadow: 0 3px 0 #145a2a; }
  #stickers button { font-size: 24px; width: 42px; height: 42px; border-radius: 50%; border: 3px solid #e3e3e3; background: #f7f7f7; cursor: pointer; padding: 0; line-height: 1; position: relative; filter: grayscale(.6); opacity: .8; transition: transform .15s; }
  #stickers button:active { transform: scale(.9); }
  #stickers button.got { filter: none; opacity: 1; border-color: #ffc933; background: #fff6d6; box-shadow: 0 0 0 3px #ffe58a; }
  #stickers button.got::after { content: "✓"; position: absolute; right: -4px; bottom: -4px; background: #49c45a; color: #fff; font-size: 12px; font-weight: 700; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; }
  #stickers button.travel { border-color: #ffc933; background: #fff6d6; animation: wiggle 2.4s ease-in-out infinite; }
  #stickers button.tool { filter: none; opacity: 1; background: #e8f0fb; border-color: #9cbbe0; }
  #bank, #mission { pointer-events: auto; display: flex; gap: 12px; align-items: center; background: #fff; border: 3px solid #1f7a3a; border-radius: 999px; padding: 6px 14px; box-shadow: 0 3px 0 #145a2a; font-size: 22px; font-weight: 700; color: #24402c; }
  #bank b { display: inline-block; min-width: 1ch; transition: transform .2s; }
  #bank b.pop { transform: scale(1.6); color: #e8a400; }
  #mission { background: #fff6d6; border-color: #e8a400; box-shadow: 0 3px 0 #b07c00; font-size: 18px; animation: wiggle 1.2s ease-in-out infinite; }
  #mission span { font-size: 26px; }
  #mission.hidden { display: none; }
  @keyframes wiggle { 50% { transform: rotate(-3deg) scale(1.05); } }
  #home { position: fixed; left: 14px; bottom: 14px; background: #fff; color: #1f7a3a; border: 3px solid #1f7a3a; border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 16px; text-decoration: none; box-shadow: 0 3px 0 #145a2a; }
  #beep { position: fixed; right: 14px; bottom: 14px; width: 86px; height: 86px; border-radius: 50%; border: 5px solid #fff; background: radial-gradient(circle at 35% 30%, #ff7a70, #e8322f 60%, #b81f1c); color: #fff; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 22px; box-shadow: 0 5px 0 #8e1715, 0 8px 16px rgba(0,0,0,.25); cursor: pointer; }
  #music { position: fixed; left: 14px; bottom: 66px; width: 52px; height: 52px; border-radius: 50%; background: #fff; border: 3px solid #1f7a3a; box-shadow: 0 3px 0 #145a2a; font-size: 26px; line-height: 1; padding: 0; cursor: pointer; }
  #music.off { filter: grayscale(1); opacity: .55; }
  #music:active { transform: translateY(2px); box-shadow: 0 1px 0 #145a2a; }
  #beep:active { transform: translateY(4px); box-shadow: 0 1px 0 #8e1715; }
  #garage { position: fixed; inset: 0; background: rgba(20, 50, 30, .55); display: none; align-items: center; justify-content: center; padding: 16px; }
  #garage.open { display: flex; }
  #garage .panel { background: #fffaf0; border: 6px solid #1f7a3a; border-radius: 28px; padding: 18px; max-width: 640px; width: 100%; box-shadow: 0 10px 0 #145a2a; }
  #garage h2 { margin: 0 0 12px; text-align: center; color: #1f7a3a; font-size: 32px; }
  #garage .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  #garage .ride { background: #fff; border: 4px solid #dfe6ee; border-radius: 20px; padding: 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; font-family: Fredoka, sans-serif; font-size: 18px; font-weight: 700; color: #34495e; }
  #garage .ride:active { transform: scale(.96); }
  #garage .ride.sel { border-color: #ffc933; background: #fff6d6; }
  #garage canvas { width: 100%; height: auto; aspect-ratio: 16 / 10; }
  #garage .back { display: block; margin: 14px auto 0; font-family: Fredoka, sans-serif; font-size: 20px; font-weight: 700; border: none; background: #1f7a3a; color: #fff; border-radius: 999px; padding: 10px 28px; cursor: pointer; }
  @media (max-width: 620px) {
    #stickers button { width: 34px; height: 34px; font-size: 19px; }
    #fuel .gauge { width: 60px; }
    #garage .grid { grid-template-columns: repeat(2, 1fr); }
    #beep { width: 72px; height: 72px; font-size: 18px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="fuel"><span class="icon">⛽</span><div class="gauge"><div class="fill"></div></div></div>
  <div id="bank"><span>🪙 <b id="coinCount">0</b></span><span>🍦 <b id="coneCount">0</b></span></div>
  <div id="mission" class="hidden">Mission: <span id="missionIcon"></span></div>
  <div id="stickers"></div>
</div>
<a id="home" href="/">← Jack's site</a>
<button id="music" aria-label="Music on or off">🎵</button>
<button id="beep" aria-label="Beep the horn">BEEP!</button>
<div id="garage">
  <div class="panel">
    <h2>Pick a ride!</h2>
    <div class="grid" id="rides"></div>
    <button class="back" id="garageBack">Let's go!</button>
  </div>
</div>
<script>
(() => {
  // =========================================================
  // The mat is drawn in its own 1400 x 800 space, then scaled.
  // =========================================================
  const MW = 1400, MH = 800, RW = 44;
  // Castle Town is a second mat, 1000 units up the road from Jack's Town.
  const OY = -1000, TOWN_Y = [0, OY], townOf = y => (y < -100 ? 1 : 0);

  // Named road points (intersections and the stops in front of places)
  const N = {
    TL: [110, 100], T1: [255, 100], T2: [500, 100], T3: [680, 100], T4: [880, 100], H: [965, 100], T5: [1080, 100], TR: [1290, 100],
    ML: [110, 420], BL: [110, 710],
    R1: [1290, 260], MR: [1290, 420], R2: [1290, 580], BR: [1290, 710],
    BB: [240, 710], BG: [440, 710], B2: [560, 710], B3: [740, 710], B4: [1000, 710],
    M1: [220, 448], M2: [405, 474], X: [680, 480], M3: [930, 432], M4: [1080, 420],
    D1a: [590, 290], D1b: [840, 595], D2a: [780, 290], D2b: [620, 600],
    C1: [1040, 350], C2: [1120, 270], C3: [1050, 180],
    RS: [1230, 580],
  };
  const N2 = {
    aTL: [110, 110], aTR: [1290, 110], aML: [110, 420], aMR: [1290, 420], aBL: [110, 710], aBR: [1290, 710],
    aBP: [280, 710], aS: [500, 710], aB2: [720, 710], aB3: [1000, 710], aHQ: [1165, 710],
    aM1: [320, 400], aG: [700, 430], aM2: [1020, 400], aK1: [520, 590], aK2: [900, 560],
  };
  Object.keys(N2).forEach(k => { N[k] = [N2[k][0], N2[k][1] + OY]; });
  const ROADS = [
    { ids: ['TL', 'T1', 'T2', 'T3', 'T4', 'H', 'T5', 'TR'] },
    { ids: ['TL', 'ML', 'BL'] },
    { ids: ['TR', 'R1', 'MR', 'R2', 'BR'] },
    { ids: ['BL', 'BB', 'BG', 'B2', 'B3', 'B4', 'BR'] },
    { ids: ['ML', 'M1', 'M2', 'X', 'M3', 'M4', 'MR'], curvy: true },
    { ids: ['T2', 'D1a', 'X', 'D1b', 'B4'], curvy: true },
    { ids: ['T4', 'D2a', 'X', 'D2b', 'B2'], curvy: true },
    { ids: ['M4', 'C1', 'C2', 'C3', 'T5'], curvy: true },
    { ids: ['R2', 'RS'] },
    { ids: ['T2', 'aS'] },   // the road between the two towns
    { ids: ['aTL', 'aTR'] },
    { ids: ['aTL', 'aML', 'aBL'] },
    { ids: ['aTR', 'aMR', 'aBR'] },
    { ids: ['aBL', 'aBP', 'aS', 'aB2', 'aB3', 'aHQ', 'aBR'] },
    { ids: ['aML', 'aM1', 'aG', 'aM2', 'aMR'], curvy: true },
    { ids: ['aS', 'aK1', 'aG'], curvy: true },
    { ids: ['aG', 'aK2', 'aB3'], curvy: true },
  ];
  const OVAL = { cx: 1118, cy: 580, rx: 112, ry: 72 };

  const PLACES = [
    { id: 'icecream', emoji: '🍦', label: 'Ice Cream', stop: 'M1', hit: [140, 280, 160, 125], bubble: 'Yum!', topper: '🍦', burst: ['🍦', '🍨', '🍧', '⭐'] },
    { id: 'pool',     emoji: '🏊', label: 'Pool', stop: 'T1', hit: [145, 128, 220, 130], bubble: 'Splash!', topper: '💦', burst: ['💦', '💧', '🌊', '⭐'] },
    { id: 'fire',     emoji: '🚒', label: 'Fire Station', stop: 'M2', hit: [325, 295, 160, 140], bubble: 'Wee-oo!', topper: '⛑️', burst: ['🔥', '💧', '⭐'] },
    { id: 'school',   emoji: '🏫', label: 'School', stop: 'T3', hit: [595, 128, 190, 125], bubble: 'Ding ding!', topper: '🎒', burst: ['🧒', '👧', '🎒', '✏️'] },
    { id: 'home',     emoji: '🏠', label: "Jack's House", stop: 'H', hit: [895, 128, 125, 150], bubble: 'Home sweet home!', topper: '🧸', burst: ['❤️', '⭐', '🧸'] },
    { id: 'hq',       emoji: '⭐', label: 'HQ', stop: 'D1b', hit: [835, 470, 130, 95], bubble: 'Mission time!', burst: ['⭐', '🎖️', '⭐'] },
    { id: 'garage',   emoji: '🔧', label: 'Garage', stop: 'M3', hit: [855, 288, 150, 112], bubble: 'New ride!' },
    { id: 'zoo',      emoji: '🦁', label: 'Zoo', stop: 'R1', hit: [1155, 128, 115, 262], bubble: 'Roar!', topper: '🎈', burst: ['🦁', '🐒', '🦒', '🐘'] },
    { id: 'baseball', emoji: '⚾', label: 'Baseball', stop: 'BB', hit: [145, 515, 200, 170], bubble: 'Home run!', topper: '🧢', burst: ['⭐', '🎉'] },
    { id: 'gas',      emoji: '⛽', label: 'Gas', stop: 'BG', hit: [350, 540, 175, 135], bubble: 'Glug glug!', burst: ['💧', '💧', '⭐'] },
    { id: 'farm',     emoji: '🐄', label: 'Farm', stop: 'B3', hit: [645, 590, 190, 98], bubble: 'Moo!', topper: '🌾', burst: ['🐔', '🐷', '🌾', '🐑'] },
    { id: 'race',     emoji: '🏁', label: 'Race Track', stop: 'RS', hit: [990, 492, 260, 180], bubble: 'You win!', topper: '🏆', burst: ['🏁', '⭐', '🎉'] },
  ];
  [
    { id: 'castle',  emoji: '🏰', label: 'Castle', stop: 'aG', hit: [520, 140, 370, 250], bubble: 'Charge!', topper: '👑', burst: ['⚔️', '🛡️', '🗡️', '👑'] },
    { id: 'ninja',   emoji: '🥷', label: "Jack's Ninja Studio", stop: 'aM1', hit: [165, 160, 290, 205], bubble: 'Hi-ya!', topper: '🥷', burst: ['🥷', '💨', '⭐', '🥋'] },
    { id: 'archery', emoji: '🏹', label: 'Bow & Arrow Shop', stop: 'aM2', hit: [915, 160, 320, 205], bubble: 'Bullseye!', topper: '🏹', burst: ['🏹', '🎯', '⭐'] },
    { id: 'park',    emoji: '🌳', label: 'Park', stop: 'aBP', hit: [150, 470, 300, 205], bubble: 'Wheee!', topper: '🎈', burst: ['🎈', '🦆', '🌷', '⭐'] },
    { id: 'hq2',     emoji: '⭐', label: 'HQ', stop: 'aHQ', hit: [1085, 520, 165, 150], bubble: 'Mission time!', burst: ['⭐', '🎖️', '⭐'], hq: true },
    { id: 'gas2',    emoji: '⛽', label: 'Gas', stop: 'aB2', hit: [640, 565, 165, 120], bubble: 'Glug glug!', burst: ['💧', '💧', '⭐'], sound: 'gas', gas: true },
  ].forEach(p => { p.town = 1; p.hit[1] += OY; PLACES.push(p); });
  PLACES.forEach(p => { p.town = p.town || 0; if (p.id === 'hq') p.hq = true; if (p.id === 'gas') p.gas = true; });
  const TOOLS = ['garage', 'hq', 'hq2', 'gas2'];
  // tap these to drive to the other town
  const GATES = [{ hit: [380, 0, 200, 80], to: 'aS' }, { hit: [370, 730 + OY, 200, 70], to: 'T2' }];
  const STICKER_IDS = PLACES.filter(p => !TOOLS.includes(p.id)).map(p => p.id);
  const CONE_PRICE = 3, MAX_COINS_ON_MAP = 7;

  // ---------- Road graph ----------
  function catmull(P) {
    const out = [];
    for (let i = 0; i < P.length - 1; i++) {
      const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || P[i + 1];
      const len = Math.hypot(p2.x - p1.x, p2.y - p1.y), steps = Math.max(2, Math.ceil(len / 22));
      for (let s = 0; s < steps; s++) {
        const t = s / steps, t2 = t * t, t3 = t2 * t;
        const f = (a, b, c, d) => 0.5 * ((2 * b) + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
        out.push({ x: f(p0.x, p1.x, p2.x, p3.x), y: f(p0.y, p1.y, p2.y, p3.y), name: s === 0 ? p1.name : null });
      }
    }
    out.push(P[P.length - 1]);
    return out;
  }
  function straight(P) {
    const out = [];
    for (let i = 0; i < P.length - 1; i++) {
      const a = P[i], b = P[i + 1], len = Math.hypot(b.x - a.x, b.y - a.y), steps = Math.max(1, Math.ceil(len / 36));
      for (let s = 0; s < steps; s++) out.push({ x: a.x + (b.x - a.x) * s / steps, y: a.y + (b.y - a.y) * s / steps, name: s === 0 ? a.name : null });
    }
    out.push(P[P.length - 1]);
    return out;
  }
  const G = [], named = {}, ROAD_PTS = [];
  const nodeFor = pt => {
    if (pt.name) { if (named[pt.name] === undefined) { named[pt.name] = G.length; G.push({ x: pt.x, y: pt.y, adj: [] }); } return named[pt.name]; }
    G.push({ x: pt.x, y: pt.y, adj: [] }); return G.length - 1;
  };
  ROADS.forEach(r => {
    const P = r.ids.map(id => ({ x: N[id][0], y: N[id][1], name: id }));
    const pts = r.curvy ? catmull(P) : straight(P);
    ROAD_PTS.push(pts);
    let prev = null;
    pts.forEach(pt => { const n = nodeFor(pt); if (prev !== null && prev !== n) { G[prev].adj.push(n); G[n].adj.push(prev); } prev = n; });
  });
  PLACES.forEach(p => { p.node = named[p.stop]; });

  function shortest(a, b) {
    const n = G.length, dist = new Float64Array(n).fill(Infinity), prev = new Int32Array(n).fill(-1), done = new Uint8Array(n);
    dist[a] = 0;
    for (;;) {
      let u = -1, best = Infinity;
      for (let i = 0; i < n; i++) if (!done[i] && dist[i] < best) { best = dist[i]; u = i; }
      if (u < 0 || u === b) break;
      done[u] = 1;
      for (const w of G[u].adj) { const d = best + Math.hypot(G[w].x - G[u].x, G[w].y - G[u].y); if (d < dist[w]) { dist[w] = d; prev[w] = u; } }
    }
    const path = []; let cur = b;
    while (cur !== -1 && cur !== a) { path.unshift(cur); cur = prev[cur]; }
    return cur === a ? path : [];
  }
  const LAP = [];
  for (let i = 1; i <= 72; i++) { const a = -i / 72 * Math.PI * 2; LAP.push({ x: OVAL.cx + OVAL.rx * Math.cos(a), y: OVAL.cy + OVAL.ry * Math.sin(a) }); }

  // ---------- Rides ----------
  const RIDES = {
    car:     { name: 'Red Car',    speed: 250, gas: true },
    tractor: { name: 'Tractor',    speed: 150, gas: true },
    bike:    { name: 'Bike',       speed: 180, gas: false },
    fire:    { name: 'Fire Truck', speed: 235, gas: true },
    bus:     { name: 'School Bus', speed: 200, gas: true },
    police:  { name: 'Police Car', speed: 275, gas: true },
  };
  const home = G[named.H];
  const v = { x: home.x, y: home.y, cur: named.H, angle: 0, target: 0, type: 'car', path: [], pending: null, fuel: 1, topper: null, moving: false };
  try { const saved = localStorage.getItem('jacktown-ride'); if (saved && RIDES[saved]) v.type = saved; } catch (e) {}

  // ---------- Canvas & scaling ----------
  const cv = document.getElementById('game'), ctx = cv.getContext('2d');
  const statics = [0, 1].map(() => document.createElement('canvas'));
  let camY = 0, curTown = 0;
  const hud = document.getElementById('hud');
  let W = 0, H = 0, S = 1, ox = 0, oy = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; statics.forEach(k => { k.width = cv.width; k.height = cv.height; });
    const top = hud.getBoundingClientRect().bottom + 12;
    const availW = W - 24, availH = H - top - 12;
    S = Math.min(availW / MW, availH / MH);
    ox = (W - MW * S) / 2; oy = top + (availH - MH * S) / 2;
    drawStatic(0); drawStatic(1);
  }
  window.addEventListener('resize', resize);
  const matTransform = (c, cam = 0) => c.setTransform(dpr * S, 0, 0, dpr * S, dpr * ox, dpr * (oy - cam * S));

  // ---------- Audio ----------
  let AC = null;
  function ac() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }
  function tone(f, start, dur, type = 'sine', vol = 0.15, fEnd) {
    const a = ac(); if (!a) return;
    const t = a.currentTime + start, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (fEnd) o.frequency.exponentialRampToValueAtTime(fEnd, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(start, dur, vol = 0.2, freq = 1200) {
    const a = ac(); if (!a) return;
    const t = a.currentTime + start, buf = a.createBuffer(1, Math.floor(a.sampleRate * dur), a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq;
    const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(a.destination); s.start(t);
  }
  // ---------- Driving song (loops while you play) ----------
  const NOTE = { G4: 392, C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880, C6: 1046.5, C3: 130.81, F3: 174.61, G3: 196 };
  const TUNE = [
    'C5 E5 G5 E5 C5 E5 G5 -', 'A5 G5 E5 G5 D5 - - -', 'F5 A5 C6 A5 F5 A5 G5 -', 'E5 D5 C5 D5 E5 - - -',
    'C5 E5 G5 E5 C5 E5 G5 -', 'A5 G5 E5 G5 C6 - - -', 'A5 G5 F5 E5 D5 E5 F5 D5', 'C5 - G4 - C5 - - -',
  ].join(' ').split(' ');
  const BASS = ['C3', 'C3', 'F3', 'C3', 'C3', 'C3', 'F3', 'C3'], BASS2 = ['G3', 'G3', 'C3', 'G3', 'G3', 'G3', 'G3', 'G3'];
  const STEP = 0.21;
  let musicOn = true, musicBus = null, songStep = 0, songNext = 0, ducked = false;
  try { if (localStorage.getItem('jacktown-music') === 'off') musicOn = false; } catch (e) {}
  function songNote(f, t, dur, type, vol) {

        coins.splice(i, 1); state.coins += 1; saveBank(); pop('coinCount');
        tone(988, 0, .08, 'square', .07); tone(1319, .08, .25, 'square', .07);
        state.particles.push({ e: '✨', x: v.x, y: v.y - 10, vx: 0, vy: -60, g: 0, life: 0, max: .7, size: 22 });
      }
    }
    state.coinTimer = (state.coinTimer || 0) + dt;
    if (coinsIn(curTown) < MAX_COINS_ON_MAP && state.coinTimer > 2.5) { state.coinTimer = 0; addCoin(); }

    if (state.event && !state.event.lap) {
      state.event.t += dt;
      if (state.event.place.gas) v.fuel = Math.min(1, v.fuel + dt * .6);
      if (state.event.t >= state.event.dur) finishEvent();
    }
    if (state.celebrate > 0) { state.celebrate -= dt; if (state.celebrate <= 0) { townStickers(state.celebrateTown || 0).forEach(id => state.visited.delete(id)); updateHud(); } }
    if (state.honk > 0) state.honk -= dt;

    state.particles.forEach(p => { p.life += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; });
    state.particles = state.particles.filter(p => p.life < p.max);
    fuelFill.style.width = Math.round(v.fuel * 100) + '%';
    fuelEl.classList.toggle('low', v.fuel < .2);
  }

  function bubble(text, x, y) {
    ctx.font = '700 17px Fredoka, sans-serif';
    const w = ctx.measureText(text).width + 22, h = 30;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#24402c'; ctx.lineWidth = 2.5;
    rr(ctx, x - w / 2, y - h, w, h, h / 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 7, y - 1); ctx.lineTo(x, y + 9); ctx.lineTo(x + 7, y - 1); ctx.fill();
    ctx.fillStyle = '#24402c'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, x, y - h / 2 + 1);
  }

  function drawLive(time) {
    // traffic light at the big X
    const phase = time % 7, lx = 712, ly = 512;
    ctx.strokeStyle = '#666'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(lx, ly + 18); ctx.lineTo(lx, ly + 44); ctx.stroke();
    rect(ctx, '#222', lx - 7, ly - 18, 14, 36, 4);
    [['#ff3b30', phase >= 4], ['#ffcc00', phase >= 3 && phase < 4], ['#3ddc5a', phase < 3]].forEach(([col, on], i) => { ctx.fillStyle = on ? col : '#444'; ctx.beginPath(); ctx.arc(lx, ly - 11 + i * 11, 4, 0, 7); ctx.fill(); });
    // school flag
    ctx.fillStyle = '#e8322f'; ctx.beginPath(); ctx.moveTo(778, 197); ctx.lineTo(800 + Math.sin(time * 5) * 3, 203); ctx.lineTo(778, 210); ctx.fill();
    // fire station flashing
    if (state.event && state.event.place.id === 'fire') { ctx.fillStyle = Math.floor(time * 8) % 2 ? 'rgba(255,60,50,.35)' : 'rgba(60,110,255,.35)'; rr(ctx, 322, 306, 166, 128, 8); ctx.fill(); }
    // HQ antenna light
    ctx.fillStyle = Math.floor(time * 2) % 2 ? '#ff3b30' : '#7a1a16'; ctx.beginPath(); ctx.arc(888, 461, 3.5, 0, 7); ctx.fill();
    // coins on the road
    coins.forEach(k => {
      const sx = Math.abs(Math.cos(time * 3 + k.phase));
      ctx.save(); ctx.translate(k.x, k.y - 4 + Math.sin(time * 4 + k.phase) * 2); ctx.scale(Math.max(.15, sx), 1);
      ctx.fillStyle = '#c98a00'; ctx.beginPath(); ctx.arc(0, 1.5, 10, 0, 7); ctx.fill();
      ctx.fillStyle = '#ffcc33'; ctx.beginPath(); ctx.arc(0, 0, 10, 0, 7); ctx.fill();
      ctx.fillStyle = '#ffe58a'; ctx.beginPath(); ctx.arc(0, 0, 6.5, 0, 7); ctx.fill();
      ctx.fillStyle = '#e8a400'; ctx.font = '700 10px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('★', 0, 1);
      ctx.restore();
    });
    // mission marker over the target place
    if (state.mission) {
      const [hx, hy, hw] = state.mission.hit;
      emoji(ctx, '⬇️', hx + hw / 2, hy - 4 + Math.sin(time * 6) * 6, 30);
    }
    // Castle Town: waving flags, HQ light, fountain
    [[610, 140], [700, 126], [792, 140]].forEach(([x, y], i) => { ctx.fillStyle = i === 1 ? '#f4c430' : '#e8322f'; ctx.beginPath(); ctx.moveTo(x, y + OY); ctx.lineTo(x + 20 + Math.sin(time * 5 + i) * 3, y + 6 + OY); ctx.lineTo(x, y + 12 + OY); ctx.fill(); });
    ctx.fillStyle = Math.floor(time * 2) % 2 ? '#ff3b30' : '#7a1a16'; ctx.beginPath(); ctx.arc(1164, 546 + OY, 3.5, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2;
    [-1, 1].forEach(d => { ctx.beginPath(); ctx.moveTo(350, 546 + OY); ctx.quadraticCurveTo(350 + d * 14, 538 + OY + Math.sin(time * 6) * 2, 350 + d * 20, 562 + OY); ctx.stroke(); });
    // little splash at the pool
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2; const r = 6 + (time * 10 % 12); ctx.beginPath(); ctx.ellipse(205, 221, r, r * .45, 0, 0, 7); ctx.stroke();
  }

  function render(time) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#f3e3c3'; ctx.fillRect(0, 0, cv.width, cv.height);
    const fade = d => (d < 1 ? 1 : Math.max(0, Math.min(1, (1000 - d) / 150)));
    statics.forEach((k, t) => { const a = fade(Math.abs(camY - TOWN_Y[t])); if (a > 0) { ctx.globalAlpha = a; ctx.drawImage(k, 0, Math.round((TOWN_Y[t] - camY) * S * dpr)); } });
    matTransform(ctx, camY);
    // the road piece that joins the two mats
    ctx.globalAlpha = Math.min(fade(Math.abs(camY)), fade(Math.abs(camY - OY)));
    if (camY < 0 && camY > OY) {
      ctx.lineCap = 'butt';
      [['#d3ccb4', RW + 6], ['#f7f3e6', RW], ['#e2b731', 2.5]].forEach(([col, w]) => { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(500, 14); ctx.lineTo(500, -214); ctx.stroke(); });
      ctx.lineCap = 'round';
      emoji(ctx, '🌳', 440, -70, 26); emoji(ctx, '🌲', 565, -130, 26); emoji(ctx, '🪨', 560, -50, 16);
    }
    ctx.globalAlpha = 1;
    // moving bits only show on the mats that are in view
    ctx.save(); ctx.beginPath();
    TOWN_Y.forEach(ty => { if (fade(Math.abs(camY - ty)) > 0) ctx.rect(-12, ty - 12, MW + 24, MH + 24); });
    ctx.clip(); drawLive(time); ctx.restore();

    const bounce = v.moving ? Math.sin(time * 18) * .8 : 0, shake = state.honk > 0 ? Math.sin(time * 60) * 1.2 : 0;
    drawVehicle(ctx, v.type, v.x + shake, v.y + bounce, v.angle, 40, time);
    if (v.topper) emoji(ctx, v.topper, v.x, v.y - 20 + bounce, 20);
    if (state.honk > 0) bubble(v.type === 'bike' ? 'Ring ring!' : v.type === 'tractor' ? 'Honk honk!' : (v.type === 'fire' || v.type === 'police') ? 'Wee-oo!' : 'Beep beep!', v.x, v.y - 26);

    state.particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, 1 - p.life / p.max);
      if (p.confetti) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot + p.life * 5); ctx.fillStyle = p.color; ctx.fillRect(-7, -3.5, 14, 7); ctx.restore(); }
      else emoji(ctx, p.e, p.x, p.y, p.size * (p.grow ? 1 + p.life * 1.2 : 1));
      ctx.globalAlpha = 1;
    });

    const ev = state.event;
    if (ev && ev.place.id !== 'garage') bubble(ev.lap ? 'Vroom vroom!' : (ev.say || ev.place.bubble), v.x, v.y - 30);

    if (!state.started) {
      emoji(ctx, '👆', 220, 372 + Math.sin(time * 4) * 6, 40);
      bubble('Tap a place to drive!', 220, 330);
    }
    if (state.celebrate > 0) {
      ctx.translate(0, camY);
      ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(-50, -50, MW + 100, MH + 100);
      emoji(ctx, '🏆', MW / 2, MH / 2 - 50, 140 * (1 + Math.sin(time * 6) * .05));
      ctx.font = '700 64px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 10; ctx.strokeStyle = '#fff'; ctx.strokeText('Hooray, Jack!', MW / 2, MH / 2 + 70);
      ctx.fillStyle = '#e8322f'; ctx.fillText('Hooray, Jack!', MW / 2, MH / 2 + 70);
      ctx.translate(0, -camY);
    }
    if (state.garageOpen) drawGarageRides(time);
  }

  let last = performance.now(), time = 0;
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now; time += dt;
    update(dt); engineTick(); render(time);
    requestAnimationFrame(frame);
  }
  updateHud(); resize(); saveBank();
  for (let i = 0; i < MAX_COINS_ON_MAP; i++) { addCoin(0); addCoin(1); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
  requestAnimationFrame(frame);
})();
</script>
</body>
